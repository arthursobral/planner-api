services:
  db:
    # pgvector/pgvector, não postgres puro: já vem com a extensão "vector"
    # instalada (só falta ativar, feito no startup do app — ver app/db.py).
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: planner
      POSTGRES_PASSWORD: planner
      POSTGRES_DB: planner
    ports:
      - "5432:5432"
    volumes:
      - planner_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U planner"]
      interval: 3s
      timeout: 3s
      retries: 10

  ollama:
    # Geração 100% local para o RAG (app/rag/ollama_client.py) — sem API paga,
    # nada sai da máquina. Não vem com modelo nenhum pré-baixado: rode uma vez
    #   docker compose exec ollama ollama pull llama3.2:3b
    # (ver README, seção RAG).
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"

  api:
    build: .
    env_file:
      # required: false — sem isso, "docker compose" recusa QUALQUER comando
      # (até "up -d db" ou "build") quando .env não existe, mesmo não tocando
      # no serviço api. É o caso do CI, que nunca cria um .env real.
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://planner:planner@db:5432/planner
      OLLAMA_URL: http://ollama:11434
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started

volumes:
  planner_db_data:
  ollama_data:
